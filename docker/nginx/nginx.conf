events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Upstream pool: Least Connections load balancing across Express API instances
    upstream pulsegrid_api_cluster {
        least_conn;
        server api-1:3000 max_fails=3 fail_timeout=10s;
        server api-2:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Proxy headers preserving real client identity
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Route all /api/ traffic to the load-balanced API cluster
        location /api/ {
            proxy_pass http://pulsegrid_api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Fast edge health check
        location /health {
            proxy_pass http://pulsegrid_api_cluster/api/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
