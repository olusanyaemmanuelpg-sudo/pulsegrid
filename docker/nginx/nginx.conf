events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance: Gzip compression for API JSON and frontend static assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream pool: Least Connections load balancing across Express API instances
    upstream pulsegrid_api_cluster {
        least_conn;
        server api-1:3000 max_fails=3 fail_timeout=10s;
        server api-2:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Standard client ingress settings
        client_max_body_size 10M;

        # Proxy headers preserving real client identity
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Root static frontend serving (Single-Page App fallback)
        root /usr/share/nginx/html;
        index index.html;

        # Route all /api/ traffic to the load-balanced API cluster
        location /api/ {
            proxy_pass http://pulsegrid_api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Fast edge health check
        location /health {
            proxy_pass http://pulsegrid_api_cluster/api/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Cache static build assets
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # React SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
