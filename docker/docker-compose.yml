services:
  primary:
    image: postgres:15
    container_name: pulsegrid-primary
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?Set REPLICATION_PASSWORD in docker/.env}
      POSTGRES_DB: pulsegrid
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - primary_data:/var/lib/postgresql/data
      - ./postgres-primary:/docker-entrypoint-initdb.d:ro
      - ./postgres-primary/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - wal_keep_size=1GB
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    networks:
      - pulsegrid-net

  replica:
    image: postgres:15
    container_name: pulsegrid-replica
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
      POSTGRES_DB: pulsegrid
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?Set REPLICATION_PASSWORD in docker/.env}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - replica_data:/var/lib/postgresql/data
      - ./postgres-replica/01-setup-replica.sh:/usr/local/bin/replica-entrypoint.sh:ro
    entrypoint: ['/bin/bash', '/usr/local/bin/replica-entrypoint.sh']
    command: ['postgres']
    depends_on:
      - primary
    networks:
      - pulsegrid-net

  redis:
    image: redis:7-alpine
    container_name: pulsegrid-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6380:6379'
    networks:
      - pulsegrid-net

  # ==========================================
  # HORIZONTALLY SCALED WEB API TIER (STATELESS)
  # ==========================================
  api-1:
    image: pulsegrid-backend:latest
    container_name: pulsegrid-api-1
    restart: unless-stopped
    environment:
      PORT: 3000
      INSTANCE_ID: api-1
      RUN_WORKERS: 'false'
      NODE_ENV: production
      DB_SSL: 'false'
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@primary:5432/pulsegrid
      DATABASE_READ_URL: postgresql://postgres:${POSTGRES_PASSWORD}@replica:5432/pulsegrid
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      MONITOR_TARGET_ENCRYPTION_KEY: ${MONITOR_TARGET_ENCRYPTION_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:3000}
      RATE_LIMIT_FAIL_OPEN: 'true'
    depends_on:
      - primary
      - replica
      - redis
    networks:
      - pulsegrid-net

  api-2:
    image: pulsegrid-backend:latest
    container_name: pulsegrid-api-2
    restart: unless-stopped
    environment:
      PORT: 3000
      INSTANCE_ID: api-2
      RUN_WORKERS: 'false'
      NODE_ENV: production
      DB_SSL: 'false'
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@primary:5432/pulsegrid
      DATABASE_READ_URL: postgresql://postgres:${POSTGRES_PASSWORD}@replica:5432/pulsegrid
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      MONITOR_TARGET_ENCRYPTION_KEY: ${MONITOR_TARGET_ENCRYPTION_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:3000}
      RATE_LIMIT_FAIL_OPEN: 'true'
    depends_on:
      - primary
      - replica
      - redis
    networks:
      - pulsegrid-net

  # ==========================================
  # HORIZONTALLY SCALED PROBER WORKER CLUSTER
  # ==========================================
  worker-1:
    image: pulsegrid-backend:latest
    container_name: pulsegrid-worker-1
    restart: unless-stopped
    command: ['node', 'worker.js']
    environment:
      WORKER_ID: worker-1
      NODE_ENV: production
      DB_SSL: 'false'
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@primary:5432/pulsegrid
      DATABASE_READ_URL: postgresql://postgres:${POSTGRES_PASSWORD}@replica:5432/pulsegrid
      REDIS_URL: redis://redis:6379
      MONITOR_TARGET_ENCRYPTION_KEY: ${MONITOR_TARGET_ENCRYPTION_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    depends_on:
      - primary
      - redis
    networks:
      - pulsegrid-net

  worker-2:
    image: pulsegrid-backend:latest
    container_name: pulsegrid-worker-2
    restart: unless-stopped
    command: ['node', 'worker.js']
    environment:
      WORKER_ID: worker-2
      NODE_ENV: production
      DB_SSL: 'false'
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@primary:5432/pulsegrid
      DATABASE_READ_URL: postgresql://postgres:${POSTGRES_PASSWORD}@replica:5432/pulsegrid
      REDIS_URL: redis://redis:6379
      MONITOR_TARGET_ENCRYPTION_KEY: ${MONITOR_TARGET_ENCRYPTION_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    depends_on:
      - primary
      - redis
    networks:
      - pulsegrid-net

  # ==========================================
  # NGINX REVERSE PROXY & LOAD BALANCER (EDGE)
  # ==========================================
  loadbalancer:
    image: nginx:alpine
    container_name: pulsegrid-loadbalancer
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - api-1
      - api-2
    networks:
      - pulsegrid-net

volumes:
  primary_data:
  replica_data:
    name: pulsegrid_replica_data_v2

networks:
  pulsegrid-net:
    driver: bridge
