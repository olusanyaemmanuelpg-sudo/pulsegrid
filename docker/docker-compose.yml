x-backend: &backend
  image: pulsegrid-backend:latest
  build:
    context: ./backend
    dockerfile: Dockerfile

services:
  primary:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
      POSTGRES_DB: pulsegrid
    volumes:
      - primary_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - pulsegrid-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
    networks:
      - pulsegrid-net

  api-1:
    <<: *backend
    restart: unless-stopped
    environment:
      PORT: 3000
      INSTANCE_ID: api-1
      RUN_WORKERS: 'false'
      NODE_ENV: production
      DB_SSL: 'false'
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@primary:5432/pulsegrid
      DATABASE_READ_URL: postgresql://postgres:${POSTGRES_PASSWORD}@primary:5432/pulsegrid
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in Coolify}
      MONITOR_TARGET_ENCRYPTION_KEY: ${MONITOR_TARGET_ENCRYPTION_KEY:?Set MONITOR_TARGET_ENCRYPTION_KEY in Coolify}
      ADMIN_EMAILS: ${ADMIN_EMAILS:?Set ADMIN_EMAILS in Coolify}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN to the public HTTPS site origin in Coolify}
      RATE_LIMIT_FAIL_OPEN: 'true'
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    depends_on:
      primary:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - pulsegrid-net

  api-2:
    <<: *backend
    restart: unless-stopped
    environment:
      PORT: 3000
      INSTANCE_ID: api-2
      RUN_WORKERS: 'false'
      NODE_ENV: production
      DB_SSL: 'false'
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@primary:5432/pulsegrid
      DATABASE_READ_URL: postgresql://postgres:${POSTGRES_PASSWORD}@primary:5432/pulsegrid
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in Coolify}
      MONITOR_TARGET_ENCRYPTION_KEY: ${MONITOR_TARGET_ENCRYPTION_KEY:?Set MONITOR_TARGET_ENCRYPTION_KEY in Coolify}
      ADMIN_EMAILS: ${ADMIN_EMAILS:?Set ADMIN_EMAILS in Coolify}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN to the public HTTPS site origin in Coolify}
      RATE_LIMIT_FAIL_OPEN: 'true'
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    depends_on:
      primary:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - pulsegrid-net

  worker-1:
    <<: *backend
    restart: unless-stopped
    command: ['node', 'worker.js']
    environment:
      WORKER_ID: worker-1
      NODE_ENV: production
      DB_SSL: 'false'
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@primary:5432/pulsegrid
      DATABASE_READ_URL: postgresql://postgres:${POSTGRES_PASSWORD}@primary:5432/pulsegrid
      REDIS_URL: redis://redis:6379
      MONITOR_TARGET_ENCRYPTION_KEY: ${MONITOR_TARGET_ENCRYPTION_KEY:?Set MONITOR_TARGET_ENCRYPTION_KEY in Coolify}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    depends_on:
      primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-1:
        condition: service_healthy
    networks:
      - pulsegrid-net

  worker-2:
    <<: *backend
    restart: unless-stopped
    command: ['node', 'worker.js']
    environment:
      WORKER_ID: worker-2
      NODE_ENV: production
      DB_SSL: 'false'
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@primary:5432/pulsegrid
      DATABASE_READ_URL: postgresql://postgres:${POSTGRES_PASSWORD}@primary:5432/pulsegrid
      REDIS_URL: redis://redis:6379
      MONITOR_TARGET_ENCRYPTION_KEY: ${MONITOR_TARGET_ENCRYPTION_KEY:?Set MONITOR_TARGET_ENCRYPTION_KEY in Coolify}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    depends_on:
      primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-1:
        condition: service_healthy
    networks:
      - pulsegrid-net

  loadbalancer:
    image: pulsegrid-web:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    expose:
      - '80'
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    networks:
      - pulsegrid-net

volumes:
  primary_data:

networks:
  pulsegrid-net:
    driver: bridge
